name: shakti
description: "Shakti - offline-first personal safety network (VTU Project Shakti)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State + routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  # Offline-first storage
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  # Cloud
  supabase_flutter: ^2.17.2
  dio: ^5.11.1
  # Maps + location + sensors
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  sensors_plus: ^7.1.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  # Emergency hardware
  another_telephony: ^0.4.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  torch_light: ^2.0.0
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.1
  # Security
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  # Documents + sharing
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  # Utils
  uuid: ^4.6.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
