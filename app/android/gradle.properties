org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx1536m
# Plugin modules (another_telephony, torch_light) pin old JVM targets; KGP 2.x
# fails the build on the Java/Kotlin mismatch. It is harmless inside those
# self-contained modules, so demote the check to a warning.
kotlin.jvm.target.validation.mode=WARNING
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Bound memory on developer machines and CI runners.
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx768m
