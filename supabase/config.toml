# Minimal Supabase CLI config for Shakti.
# Local dev: `supabase start` (needs Docker). Remote: see README.md.
project_id = "shakti"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

# JWT is verified by the gateway AND again inside each function via auth.getUser().
[functions.ai-guard]
verify_jwt = true

[functions.emergency-dispatch]
verify_jwt = true

[functions.guardian-invite]
verify_jwt = true

# Public guardian tracker lookup by share token (no account needed).
[functions.track]
verify_jwt = false
