name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Release signing secrets are required."
            exit 1
          fi
          : "${STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Build APK + AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRACK_BASE_URL: ${{ secrets.TRACK_BASE_URL }}
        run: |
          : "${SUPABASE_URL:?Missing SUPABASE_URL}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY}"
          : "${TRACK_BASE_URL:?Missing TRACK_BASE_URL}"
          DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          if [ -n "$TRACK_BASE_URL" ]; then DEFINES="$DEFINES --dart-define=TRACK_BASE_URL=$TRACK_BASE_URL"; fi
          flutter build apk --release --obfuscate --split-debug-info=build/symbols $DEFINES
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: shakti-android-${{ github.ref_name }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/symbols
            app/build/app/outputs/mapping/release/mapping.txt

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
